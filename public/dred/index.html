<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>DRED — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'DM Mono',monospace;cursor:none;color:rgba(255,255,255,.92)}
@media(pointer:coarse){html,body{cursor:auto}}
:root{--dred:#5B4FCF;--bg:#000}
button,a{font-family:inherit}

#cur{position:fixed;z-index:999;width:8px;height:8px;border-radius:50%;
  background:var(--dred);pointer-events:none;transform:translate(-50%,-50%);
  mix-blend-mode:difference}
#grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  background-size:200px;animation:gr .3s steps(1) infinite}
@keyframes gr{0%{background-position:0 0}33%{background-position:-40px 30px}66%{background-position:30px -40px}}

#header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 32px;
  background:linear-gradient(rgba(0,0,0,.8),transparent);
}
.h-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--dred)}
.h-back{font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.50);
  text-transform:uppercase;cursor:pointer;padding:8px 4px}
.h-back:hover{color:var(--dred)}
.h-cross{font-size:10px;letter-spacing:.22em;color:rgba(255,229,0,.55);text-transform:uppercase;cursor:pointer;padding:8px 4px}
.h-cross:hover{color:rgba(255,229,0,.85)}
#lang-toggle{display:flex;align-items:center;font-size:8px;letter-spacing:.2em}
.lt{padding:8px;cursor:pointer;color:rgba(255,255,255,.50);user-select:none}
.lt.active{color:var(--dred)}
.lt-sep{color:rgba(255,255,255,.25)}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
#track{will-change:transform}
#picks,.slide{height:100vh;height:100dvh;position:relative}
#picks{
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:84px 16px 72px;
}
.kicker{font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:var(--dred);margin-bottom:12px}
#pick-line{
  font-weight:300;font-size:13px;line-height:1.7;color:rgba(255,255,255,.92);
  max-width:28em;min-height:1.7em;margin-bottom:18px;
}
#pick-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:920px}
.pick{
  background:none;border:0;padding:0;text-align:left;cursor:pointer;color:rgba(255,255,255,.50);
}
.pick img{width:100%;height:min(34dvh,280px);object-fit:cover;display:block;background:#000}
.pick span{
  display:block;margin-top:8px;font-size:8px;letter-spacing:.12em;line-height:1.45;
  color:rgba(255,255,255,.50);
}
#hint{
  margin-top:16px;font-size:8px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}

.slide{overflow:hidden;background:#000}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.veil{
  position:absolute;inset:0;background:#000;pointer-events:none;
  --x:50%;--y:42%;
  transition:opacity 1.05s cubic-bezier(.16,1,.3,1);
}
.slide.looking .veil{
  background:radial-gradient(circle 30vmax at var(--x) var(--y), transparent 0%, rgba(0,0,0,.18) 34%, #000 70%);
}
.slide.revealed .veil{opacity:0}
.subtitle{
  position:absolute;left:20px;right:20px;bottom:78px;z-index:2;
  text-align:center;font-weight:300;font-size:12px;line-height:1.7;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 16px #000;
  opacity:0;transition:opacity .6s cubic-bezier(.16,1,.3,1);
}
.slide.revealed .subtitle{opacity:1}
.slide-bar{
  position:absolute;top:74px;right:16px;z-index:3;
  display:flex;align-items:center;gap:8px;
}
.count{font-size:8px;letter-spacing:.22em;color:rgba(255,255,255,.35)}
.info,.act{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
}
.info{
  color:rgba(255,255,255,.50);background:rgba(8,8,8,.88);
  border:1px solid color-mix(in srgb, var(--dred) 45%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 14px;cursor:pointer;min-height:44px;
}
.act{font-size:8px;letter-spacing:.22em;color:var(--dred)}

#index{
  position:fixed;z-index:80;display:flex;left:0;right:0;bottom:0;
  padding:6px 8px 10px;gap:0;overflow-x:auto;justify-content:safe center;
}
.tick{
  flex:0 0 auto;width:28px;height:44px;background:transparent;border:0;cursor:pointer;position:relative;
}
.tick::before{
  content:'';position:absolute;left:8px;right:8px;top:20px;height:2px;
  background:rgba(255,255,255,.35);
}
.tick.on::before{left:4px;right:4px;background:var(--dred)}

#loading{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:none;transition:opacity .4s cubic-bezier(.16,1,.3,1)}
#loading span{font-size:9px;letter-spacing:.4em;color:color-mix(in srgb, var(--dred) 55%, transparent);text-transform:uppercase}
#leave{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9000;transition:opacity .4s cubic-bezier(.16,1,.3,1)}
#leave.on{opacity:1;pointer-events:all}

@media(min-width:800px){
  #picks{padding:120px 64px 80px;justify-content:center}
  #pick-line{font-size:15px}
  #pick-row{gap:16px}
  .pick img{height:min(46vh,460px)}
  .subtitle{font-size:14px;bottom:88px}
  #index{
    left:auto;right:10px;top:50%;bottom:auto;transform:translateY(-50%);
    flex-direction:column;overflow-y:auto;overflow-x:hidden;max-height:70vh;
    width:44px;padding:0;justify-content:center;
  }
  .tick{width:44px;height:16px}
  .tick::before{left:12px;right:12px;top:7px}
  .tick.on::before{left:6px;right:6px}
}

#detail-panel{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
#detail-panel.open{opacity:1;pointer-events:all}
#detail-inner{
  display:flex;gap:clamp(24px,4vw,60px);align-items:flex-start;
  width:90%;max-width:860px;
  transform:translateY(14px);
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
#detail-panel.open #detail-inner{transform:translateY(0)}
#detail-img{flex:0 0 auto;width:clamp(140px,24vw,280px);overflow:hidden;border:1px solid color-mix(in srgb, var(--dred) 28%, transparent)}
#detail-img img{width:100%;height:auto;display:block}
#detail-text{flex:1 1 auto;overflow-y:auto;max-height:80vh;padding-right:8px}
#detail-eyebrow{font-size:8px;letter-spacing:.32em;color:color-mix(in srgb, var(--dred) 70%, transparent);text-transform:uppercase;margin-bottom:10px}
#detail-title{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(22px,3.5vw,48px);
  color:var(--dred);letter-spacing:-.02em;line-height:1;margin-bottom:10px;
}
#detail-technique{font-size:10px;letter-spacing:.12em;line-height:1.75;color:rgba(255,255,255,.50);margin-bottom:16px}
#detail-desc{font-size:12px;line-height:1.85;color:rgba(255,255,255,.72);margin-bottom:18px}
.perspective-block{margin-bottom:14px;padding-top:12px;border-top:1px solid color-mix(in srgb, var(--dred) 22%, transparent)}
.perspective-label{font-size:8px;letter-spacing:.28em;color:var(--dred);opacity:.6;text-transform:uppercase;margin-bottom:6px}
.perspective-text{font-size:12px;line-height:1.8;color:rgba(255,255,255,.72)}
#detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.tag{
  font-size:8px;letter-spacing:.15em;text-transform:uppercase;
  padding:4px 10px;border:1px solid color-mix(in srgb, var(--dred) 45%, transparent);
  color:color-mix(in srgb, var(--dred) 80%, white);
}
#detail-actions{display:flex;flex-wrap:wrap;gap:8px}
.action-btn{
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--dred);
  background:var(--dred);color:#fff;
  cursor:pointer;text-decoration:none;display:inline-block;font-weight:400;
}
#detail-close{display:inline-block;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.50);text-transform:uppercase;cursor:pointer}
#detail-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
#like-btn{
  display:flex;align-items:center;gap:7px;
  font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.35);
  background:none;border:none;padding:8px 0;cursor:pointer;min-height:44px;
}
#like-btn.liked{color:var(--dred)}
.like-heart{font-size:14px}
#like-count{font-size:11px}
#detail-nav{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;z-index:201;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#detail-panel.open ~ #detail-nav{opacity:1;pointer-events:all}
.dn{font-size:13px;letter-spacing:.28em;color:rgba(255,255,255,.50);cursor:pointer;padding:12px;user-select:none}
#detail-counter{font-size:9px;letter-spacing:.22em;color:rgba(255,255,255,.35);display:flex;align-items:center}
.action-section-label{font-size:7px;letter-spacing:.32em;color:color-mix(in srgb, var(--dred) 70%, transparent);text-transform:uppercase;margin:16px 0 10px}

@media(max-width:680px){
  #header{padding:16px}
  #detail-panel{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #detail-inner{flex-direction:column;gap:12px;padding:72px 16px 96px;width:100%;max-width:none}
  #detail-img{width:100%}
  #detail-text{max-height:none;overflow-y:visible;padding-right:0}
  #detail-technique{display:none}
  #detail-title{font-size:clamp(20px,6vw,32px)}
  #detail-nav{bottom:14px}
}

@media(prefers-reduced-motion:reduce){
  #grain{animation:none}
  #cur{display:none}
  html,body{cursor:auto}
  .veil{opacity:0;transition:none}
  .subtitle{opacity:1;transition:none}
  #detail-inner,#detail-panel,#leave,#loading{transition:none}
}
</style>
</head>
<body>
<div id="loading"><span>loading</span></div>
<div id="grain"></div>
<div id="cur"></div>

<div id="header">
  <div class="h-name">DRED</div>
  <div id="lang-toggle">
    <span class="lt" id="lt-ko">KO</span>
    <span class="lt-sep">·</span>
    <span class="lt" id="lt-en">EN</span>
  </div>
  <div style="display:flex;gap:16px;align-items:center;">
    <div class="h-cross" id="nav-kin">← KIN</div>
    <div class="h-back">← back</div>
  </div>
</div>

<div id="stage" data-gallery="../data/kindred_gallery_dred.json">
  <div id="track">
    <section id="picks">
      <p class="kicker" id="pick-kicker">Today DRED picked</p>
      <p id="pick-line" lang="ko"></p>
      <div id="pick-row"></div>
      <p id="hint">scroll</p>
    </section>
    <div id="reel"></div>
  </div>
</div>
<nav id="index" aria-label="album"></nav>

<div id="detail-panel">
  <div id="detail-inner">
    <div id="detail-img"><img id="detail-img-el" src="" alt=""></div>
    <div id="detail-text">
      <div id="detail-eyebrow"></div>
      <div id="detail-title"></div>
      <div id="detail-technique"></div>
      <div id="detail-desc"></div>
      <div class="perspective-block">
        <div class="perspective-label">KIN</div>
        <div class="perspective-text" id="detail-kin"></div>
      </div>
      <div class="perspective-block show-mobile">
        <div class="perspective-label">DRED</div>
        <div class="perspective-text" id="detail-dred"></div>
      </div>
      <div id="detail-tags"></div>
      <div id="detail-action-section" style="display:none">
        <div class="action-section-label">↓ explore</div>
        <div id="detail-actions"></div>
      </div>
      <div id="detail-bottom">
        <button id="like-btn" type="button">
          <span class="like-heart">♡</span>
          <span id="like-count">0</span>
        </button>
        <div id="detail-close">close ×</div>
      </div>
    </div>
  </div>
</div>

<div id="detail-nav">
  <div class="dn" id="dn-prev">←</div>
  <div class="dn" id="detail-counter"></div>
  <div class="dn" id="dn-next">→</div>
</div>

<script src="../js/site-base.js"></script>
<script src="../js/gallery.js"></script>
<script src="../js/dred-album.js"></script>
</body>
</html>
